// PlumeFX: on solid-fuel boosters PlumeFX takes over flame and smoke completely.
// Removes all stock/ReStock particle effects there (flame restock-fx-srb-*, smoke, sparks). Sounds stay.
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[SolidFuel]],@EFFECTS]:FINAL
{
	@EFFECTS
	{
		@*,*
		{
			!PREFAB_PARTICLE,* {}
			!MODEL_MULTI_PARTICLE,* {}
			!MODEL_PARTICLE,* {}
			!MODEL_MULTI_SHURIKEN_PERSIST,* {}
		}
	}
}
