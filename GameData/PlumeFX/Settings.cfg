// PlumeFX - settings (read when the game starts)
// Values here override the defaults in the core (PlumeCore.cs) - keep both in sync.
PLUMEFX
{
	enabled = true
	debugLog = true            // messages tagged [PlumeFX] in KSP.log

	// --- Rendering / performance ---
	steps = 64                 // ray-marching steps per pixel (minimum fineness; dense smoke and the jet are sampled finer automatically)
	shadowSteps = 4            // steps of the shadow ray towards the sun
	maxVolumes = 0             // max. smoke sections at the same time (0 = unlimited; e.g. 400 if performance suffers)
	updateBudget = 40          // old, distant sections: this many are recomputed per frame (the rest later, saves performance)
	maxDistance = 600000       // m: smoke sections farther away are not drawn (600 km: the column is visible from orbit)
	shadows = true             // the smoke casts shadows on the ground and on vessels
	useDepth = true            // the smoke is hidden by terrain/buildings (depth buffer)
	brightness = 1.0           // overall brightness
	boil = 0.35                // boiling in the exhaust jet at the nozzle (0 = calm)
	thickness = 25             // optical density: higher = denser/more opaque (clouds look "thicker")

	// --- Exhaust jet at the nozzle (the ReStock/stock flame on boosters is removed) ---
	fire = 3                   // glow of the hot exhaust: white-hot at the nozzle -> yellow -> orange -> white smoke
	flameLength = 7            // length of the glowing part (x nozzle diameter, sea level; longer in thin air)
	flameBoost = 14            // on the ground: extra length of the blazing fire jet (x nozzle diameter); decreases with altitude
	                           //    (modelled on a Shuttle launch; the smoke only forms behind it). 0 = short flame only
	fireBoost = 1.4            // on the ground: extra brightness of the fire jet (decreases with altitude)
	jetDensity = 1             // density of the jet right behind the nozzle (1 = dense fog)
	glow = 1.0                 // firelight of the flame on the smoke right around it (0 = off)
	jetFlow = 25               // flow of the pattern in the jet (m/s per m of nozzle diameter)
	splitJets = true           // several boosters with spacing: a jet of its own per booster, converging into the column

	// --- Smoke column and trail ---
	densityCutoff = 0.004      // kg/m^3: below this (thin air, ~30 km on Kerbin) no more column (the flame stays)
	columnRadius = 3.0         // start radius (x nozzle diameter)
	columnSpacing = 2.0        // spacing of the nodes (x radius)
	trailLife = 1500           // s: the trail stays at most this long; low down it dissolves after about half of that.
	                           //    Meanwhile it spreads, thins out and frays (well visible from orbit as a line)
	windDrift = 0.3            // how strongly the smoke drifts with the wind (0 = stands still, 1 = fully)
	windShear = 1              // the wind turns and grows stronger with altitude: the trail twists over the minutes (0 = off)
	columnCloudStyle = 1       // column in the style of the ground cloud: large connected billows instead of many small shreds
	                           //    (0 = finer, more ragged billows)
	columnFoot = 0.5           // column foot: shortly after liftoff the column swells really wide at the bottom and fills the middle
	                           //    between the banks of the ground cloud (radius x size of the ground cloud; normal higher up; 0 = off)

	// --- Ground cloud: smoke parcels shoot out with the pressure of the jet (at the pad out of the flame trenches), first
	// as a flat, fast layer along the ground; once they slow down they roll up and tower at the head. The cloud grows by
	// new parts as long as the jet hits the ground: a wedge, low at the pad, tall towers further out; one trench side gets
	// more smoke than the other (random per launch). Afterwards it keeps growing for minutes, spreads, drifts with the wind
	// and thins out a little. It lies in the same volume as the column foot and the booster jets (one shared pass, no
	// overlapping volumes).
	groundCloud = true         // ground cloud at launch (false = the smoke only lies flat on the ground at launch)
	groundSize = 1.0           // size of the ground cloud (it grows with the thrust anyway)
	groundDrift = 0.7          // ground cloud and column foot drift with the surface wind (0 = stand still, 1 = fully)
	groundRange = 12           // reach of the exhaust jet to the ground (x nozzle diameter, +25 m)
	stockPadSmoke = false      // KSP's own smoke from the pad's flame trenches (off: our ground cloud streams out of the trench exits)

	// --- Smoke types (strength 0 = off) ---
	srbStrength = 1.0          // solid fuel: thick, white, stays long (Space Shuttle)
	keroloxStrength = 0        // kerosene/oxidizer (off for now: PlumeFX is for boosters only)
	methaloxStrength = 0       // methane/oxidizer (off)
	hydrogenStrength = 0       // hydrogen/nuclear (off)
}
